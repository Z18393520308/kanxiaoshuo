<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-src 'none'" />
  <title>摸鱼联盟 · 阅读设置</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="poster-panel" aria-label="摸鱼联盟海报">
      <img src="/assets/moyu-rule-one.png" width="356" height="562" alt="摸鱼法则第1条：制造忙碌的工作状态。摸鱼联盟，专注阅读，低调前行。" />
    </aside>
    <main class="main">
      <header class="page-header"><h1>设置</h1><span class="status" id="readerStatus">尚未开始</span></header>
      <div class="settings-scroll">
        <section class="section book-section" aria-labelledby="bookLabel">
          <h2 id="bookLabel">书籍文件</h2>
          <div class="path-row"><input type="text" class="input book-path" id="bookPath" readonly placeholder="选择电脑里的 TXT 小说" aria-label="书籍文件路径" aria-describedby="bookHint" /><button type="button" class="button secondary" id="btnPick">浏览</button></div>
          <p class="visually-hidden" id="bookHint">每本书分别保存进度，换书后仍可继续上次的位置。</p>
        </section>

        <section class="section style-section" aria-labelledby="styleLabel">
          <h2 id="styleLabel">阅读样式</h2>
          <div class="preview" id="preview" aria-label="阅读样式预览"><span id="previewText">这是你选择的字体大小与颜色预览</span></div>
          <label class="range-field"><span>字号</span><input type="range" id="fontSize" min="3" max="48" value="12" /><output id="fontSizeVal" for="fontSize">12</output></label>
          <p class="field-hint">行数越多，可适当调小字号，避免阅读条裁切文字。</p>
          <label class="range-field"><span>行数</span><input type="range" id="visibleLines" min="1" max="15" value="1" /><output id="visibleLinesVal" for="visibleLines">1</output></label>
          <label class="range-field"><span>字间距</span><input type="range" id="letterSpacing" min="0" max="20" step="1" value="0" title="0 为字体默认字距，最大增加 20 像素" /><output id="letterSpacingVal" for="letterSpacing">0 px</output></label>
          <div class="color-row" role="group" aria-label="文字颜色">
            <button type="button" class="swatch" data-color="#FFFFFF" style="--swatch:#FFFFFF" title="白色" aria-label="白色" aria-pressed="false"></button>
            <button type="button" class="swatch" data-color="#000000" style="--swatch:#000000" title="黑色" aria-label="黑色" aria-pressed="true"></button>
            <button type="button" class="swatch" data-color="#9DE5FE" style="--swatch:#9DE5FE" title="浅蓝色" aria-label="浅蓝色" aria-pressed="false"></button>
            <button type="button" class="swatch" data-color="#FBE9AD" style="--swatch:#FBE9AD" title="浅黄色" aria-label="浅黄色" aria-pressed="false"></button>
            <button type="button" class="swatch" data-color="#CDE7B6" style="--swatch:#CDE7B6" title="浅绿色" aria-label="浅绿色" aria-pressed="false"></button>
          </div>
        </section>

        <section class="section shortcut-section" aria-labelledby="shortcutLabel">
          <h2 id="shortcutLabel">快捷键</h2>
          <div class="shortcut-grid">
            <div class="shortcut"><span class="key-combo" id="shortcutUp"></span><span class="key-combo" id="shortcutDown"></span><span>翻页</span></div>
            <div class="shortcut"><span class="key-combo" id="shortcutHide"></span><span>隐藏</span></div>
            <div class="shortcut"><span class="key-combo" id="shortcutShow"></span><span>显示</span></div>
            <div class="shortcut"><span class="key-combo" id="shortcutMove"></span><span>复位</span></div>
          </div>
        </section>

        <div class="save-area"><p class="hint" id="hint" role="status" aria-live="polite"></p><button type="button" class="button primary" id="btnSave">保存并开始阅读</button></div>

        <div class="secondary-settings">
          <details class="settings-details">
            <summary>最近阅读 <span id="recentCount">0 本</span></summary>
            <div class="recent-list" id="recentList"></div>
            <p class="empty-state" id="recentEmpty">还没有读过的书，先浏览并选择一本 TXT 吧。</p>
          </details>
          <details class="settings-details">
            <summary>更多设置<span>字体、宽度与快捷键</span></summary>
            <div class="advanced-fields">
              <label class="field"><span>字体</span><input type="text" class="input" id="fontFamily" list="fontFamilies" maxlength="31" placeholder="Microsoft YaHei UI" /><datalist id="fontFamilies"><option value="Microsoft YaHei UI">微软雅黑</option><option value="Microsoft YaHei">微软雅黑</option><option value="SimSun">宋体</option><option value="KaiTi">楷体</option><option value="SimHei">黑体</option><option value="Segoe UI"></option></datalist></label>
              <label class="field custom-color"><span>自定义文字颜色</span><input id="fontColor" type="color" value="#000000" title="自定义颜色" aria-label="自定义文字颜色" /></label>
              <label class="field width-field"><span>阅读条宽度 <output id="windowWidthVal" for="windowWidth">800 px</output></span><input type="range" id="windowWidth" min="240" max="1600" step="10" value="800" /></label>
            </div>
            <div class="section-title"><h2>全局快捷键</h2><button type="button" class="text-button" id="btnResetHotkeys">恢复默认</button></div>
            <div class="hotkey-grid">
              <label class="hotkey-field"><span>上一页</span><input class="input hotkey" id="hotkeyUp" value="Alt+Up" maxlength="40" spellcheck="false" /></label>
              <label class="hotkey-field"><span>下一页</span><input class="input hotkey" id="hotkeyDown" value="Alt+Down" maxlength="40" spellcheck="false" /></label>
              <label class="hotkey-field"><span>隐藏</span><input class="input hotkey" id="hotkeyHide" value="Alt+C" maxlength="40" spellcheck="false" /></label>
              <label class="hotkey-field"><span>显示</span><input class="input hotkey" id="hotkeyShow" value="Alt+S" maxlength="40" spellcheck="false" /></label>
              <label class="hotkey-field"><span>复位</span><input class="input hotkey" id="hotkeyMove" value="Alt+T" maxlength="40" spellcheck="false" /></label>
            </div>
            <p class="field-hint">输入组合键，例如 Ctrl+Alt+N。保存后生效；隐藏阅读条后暂停翻页快捷键。</p>
          </details>
          <footer class="footer"><span id="version">Go 版</span><div class="footer-actions"><button type="button" class="text-button" id="btnClose">关闭设置</button><button type="button" class="text-button" id="btnExit">退出程序</button></div></footer>
        </div>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
